<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <title>Estudia IABD</title>
  <!-- La carpeta de anillas: hoja con dos agujeros, «IA» en el azul de SAA y las pestañas de los cinco módulos en el canto. Todo dentro del 80 % central para el icono «maskable». -->
