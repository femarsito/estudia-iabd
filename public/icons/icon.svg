  <g>
    <rect x="352" y="122" width="50" height="60" rx="10" fill="#2f5bea"/>
    <rect x="352" y="174" width="50" height="58" rx="10" fill="#0b7f70"/>
    <rect x="352" y="224" width="50" height="58" rx="10" fill="#7b3fe4"/>
    <rect x="352" y="274" width="50" height="58" rx="10" fill="#ff6a1a"/>
    <rect x="352" y="324" width="50" height="66" rx="10" fill="#f2c200"/>
  </g>
  <rect x="102" y="104" width="270" height="304" rx="16" fill="#fafbff"/>
  <line x1="146" y1="104" x2="146" y2="408" stroke="#121418" stroke-opacity="0.14" stroke-width="3"/>
  <circle cx="124" cy="186" r="12" fill="#121418"/>
  <circle cx="124" cy="326" r="12" fill="#121418"/>
  <!-- «IA» dibujado a mano en trazos condensados, sin depender de ninguna fuente. -->
