name: Publicar en GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      # npm install y no npm ci: el lockfile hecho en Windows no trae los opcionales @emnapi/* que Linux necesita
      # (fallo conocido de npm). Respeta las versiones del lock y solo añade lo que falta.
      # Si falla, el error sale como anotación, que se lee sin iniciar sesión.
      - name: Instalar dependencias
        run: |
          npm install --no-audit --no-fund > npm-install.log 2>&1 || { grep -m 12 -E 'npm (error|ERR)' npm-install.log | sed 's/^/::error::/'; exit 1; }
      - run: npm run test:content
      - run: npm run validate
      - run: npx ng test --watch=false
      - run: npx ng build --base-href /estudia-iabd/
      # Sin servidor propio: GitHub Pages sirve 404.html en las rutas internas al recargar.
      - run: cp dist/estudia-iabd/browser/index.html dist/estudia-iabd/browser/404.html
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist/estudia-iabd/browser

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
