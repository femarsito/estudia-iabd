name: Publicar en GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      # Si falla, las últimas líneas salen como anotaciones, que se leen sin iniciar sesión.
      - name: Instalar dependencias
        run: |
          npm ci > npm-ci.log 2>&1 || { tail -n 25 npm-ci.log | sed 's/^/::error::/'; exit 1; }
      - run: npm run test:content
      - run: npm run validate
      - run: npx ng test --watch=false
      - run: npx ng build --base-href /estudia-iabd/
      # Sin servidor propio: GitHub Pages sirve 404.html en las rutas internas al recargar.
      - run: cp dist/estudia-iabd/browser/index.html dist/estudia-iabd/browser/404.html
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist/estudia-iabd/browser

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
